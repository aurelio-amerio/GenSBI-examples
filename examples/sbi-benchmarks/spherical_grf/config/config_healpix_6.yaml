task_name: spherical_grf

strategy:
  method: "flow"
  model: "flux"

# Pipeline-side cond-id builder: "healpix-rope" (spherical RoPE on HEALPix
# pixel-center 3D coords, gensbi.recipes.HealpixRope) or "pos1d" (1D
# sinusoidal ids over NEST order — the A/B baseline, see config_pos1d.yaml).
ids:
  cond_kind: "healpix-rope"

data:
  nside: 64
  seed: 0

# HealSwin encoder: patch_size 4 embeds the nside-64 map on an nside-32 grid,
# then 3 mergings 32 -> 16 -> 8 -> 4 (192 bottleneck tokens x 512 features).
# exp-6 (v2 script): windowed attention is face-bounded, so global_depth adds
# 2 full-attention blocks over the 192 bottleneck tokens (dot-product attn,
# QK-RMS norm, HEALPix RoPE) — the encoder's only sphere-wide mixing stage.
encoder:
  embed_dim: 64
  depths: [2, 2, 6, 2]
  num_heads: [4, 8, 16, 16]
  window_size: 16
  patch_size: 4
  global_depth: 2
  global_num_heads: 8
  global_axes_dim: [22, 22, 20]   # (x, y, z); sum = 64 = features/heads
  param_dtype: "float32"   # fp32 master weights
  dtype: "bfloat16"        # bf16 compute

model:
  in_channels: 1
  vec_in_dim: null
  context_in_dim: 512      # = encoder embed_dim * 2^(len(depths)-1); asserted
  mlp_ratio: 4.0
  num_heads: 6
  depth: 4
  depth_single_blocks: 8
  axes_dim: [22, 22, 20]   # (x, y, z); sum = 64 = hidden/heads
  theta: null              # null -> derived from HealpixRope(nside_bottleneck).theta
  qkv_bias: true
  param_dtype: "float32"   # fp32 master weights
  dtype: "bfloat16"        # bf16 compute
  id_embedding_strategy: ["absolute", "rope"]   # model-side: apply RoPE to cond ids

# exp-6 schedule vs exp-5: max_lr 1e-4 -> 7e-5 (sqrt batch-size rule at
# batch 64), decay_transition 0.85 -> 0.6 (exp-5's loss was still falling
# hard when its 15% decay tail ran out — spend 40% of the run decaying).
optimizer:
  warmup_steps: 500
  decay_transition: 0.6
  max_lr: 7.0e-5
  min_lr: 1.0e-6

training:
  batch_size: 64            # batch 128 OOM'd on 40 GB A100 (30.75 GiB alloc); ~15 GiB at 64
  val_batch_size: 64
  nsteps: 150000
  ema_decay: 0.999
  multistep: 1
  early_stopping: true
  val_every: 100
  experiment_id: 6          # orbax checkpoint step — must be an int (repo convention)
  run_name: "spherical_grf_fm_healpix_6"   # file/dir naming stem for results, imgs, checkpoints
  train_model: true
  restore_model: false

evaluation:
  observations: [1, 2, 3]
  num_posterior_samples: 10000
  sample_chunk_size: 1000   # sampler memory scales with chunk (~3 GiB here)
  sample_step_size: 0.01
  tarp_pairs: 200
  tarp_posterior_samples: 1000
