# exp-8b post-run eval — TARP, ODE regime (dopri5 sampler), on the 8b
# checkpoint. base_config rebuilds the 8b architecture so the checkpoint
# restores correctly. Design: docs/superpowers/specs/2026-08-14-spherical-grf-exp8-design.md
base_config: config/config_healpix_8b.yaml

data:
  augment: false

training:
  train_model: false
  restore_model: true

evaluation:
  observations: []          # matrix skipped in tarp mode
  tarp_pairs: 200
  tarp_posterior_samples: 1000

diagnostic:
  mode: tarp_ode            # output stem: spherical_grf_fm_healpix_8bdiag_tarp_ode
  variants:
    - name: dopri5
      kind: dopri5
